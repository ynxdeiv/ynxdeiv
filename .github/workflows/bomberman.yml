name: generate snake contribution graph

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ynxdeiv
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23FF4FA3&color_dots=%23FFF0F6,%23FFB4D8,%23FF4FA3,%23C8102E,%235A2A43
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23FF4FA3&color_dots=%231A0410,%23FFB4D8,%23FF4FA3,%23C8102E,%23FFF4E8

      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
